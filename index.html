<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="calculator.js"></script> 
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-display">
            <p id="prevTotal"></p>
            <p id="currentNumber"></p>
        </div>
        <div class="calculator-grid">
            <div class="row">
                <button id="clear" class="function">Clear</button>
                <button id = "back" class="function">Back</button>
                <button id="parenthesis" class="function">()</button>
                <button id="operator" class="operator">/</button>
            </div>
            <div class="row">
                <button id="num-button" class="num-button">7</button>
                <button id="num-button" class="num-button">8</button>
                <button id="num-button" class="num-button">9</button>
                 <button id="operator" class="operator">*</button>
            </div>
            <div class="row">
                <button id ="num-button" class="num-button">4</button>
                <button id ="num-button" class="num-button">5</button>
                <button id ="num-button" class="num-button">6</button>
                <button id="operator" class="operator">-</button>
            </div>
            <div class="row">
                <button id="num-button" class="num-button">1</button>
                <button id="num-button" class="num-button">2</button>
                <button id="num-button" class="num-button">3</button>
                <button id="operator" class="operator">+</button>
            </div>
            <div class="row">
                <button id="negative" class="num-button">+/-</button>
                <button id="num-button" class="num-button">0</button>
                <button id="decimal" class="num-button">.</button>
                <button id="equals" class="operator">=</button>
            </div>
        </div>
    </div>
  <!-- <span><img alt="Lady confused at math" src="images/math.jpg"></span>  -->
</body>
</html>
