<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="calculator.js"></script> 
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-display">
            <p id="prevTotal">8</p>
            <p id="currentNumber"></p>
        </div>
        <div class="calculator-grid">
            <div class="row">
                <button id="clear" class="num-button function">Clear</button>
                <button id = "back" class="num-button function">Back</button>
                <button id="parenthesis" class="num-button function">()</button>
                <button id="divide" class="num-button operator">/</button>
            </div>
            <div class="row">
                <button id="seven" class="num-button">7</button>
                <button id="eight" class="num-button">8</button>
                <button id="nine" class="num-button">9</button>
                 <button id="multiply" class="num-button operator">*</button>
            </div>
            <div class="row">
                <button id ="four" class="num-button">4</button>
                <button id ="five" class="num-button">5</button>
                <button id ="six" class="num-button">6</button>
                <button id="subtract" class="num-button operator">-</button>
            </div>
            <div class="row">
                <button id="one" class="num-button">1</button>
                <button id="two" class="num-button">2</button>
                <button id="three" class="num-button">3</button>
                <button id="add" class="num-button operator">+</button>
            </div>
            <div class="row">
                <button id="negative" class="num-button">+/-</button>
                <button id="zero" class="num-button">0</button>
                <button id="decimal" class="num-button">.</button>
                <button id="equals" class="num-button operator">=</button>
            </div>
        </div>
    </div>
  <!-- <span><img alt="Lady confused at math" src="images/math.jpg"></span>  -->
</body>
</html>
